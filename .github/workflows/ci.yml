name: CI

on: [push, pull_request]

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "2" # 2 cores on each GHA VM, enable parallel builds
  CTEST_OUTPUT_ON_FAILURE: "ON" # This way we don't need a flag to ctest
  CTEST_PARALLEL_LEVEL: "2"
  CTEST_TIME_TIMEOUT: "5"  # some failures hang forever
  HOMEBREW_NO_ANALYTICS: "ON" # Make Homebrew installation a little quicker
  HOMEBREW_NO_AUTO_UPDATE: "ON"
  HOMEBREW_NO_BOTTLE_SOURCE_FALLBACK: "ON"
  HOMEBREW_NO_GITHUB_API: "ON"
  HOMEBREW_NO_INSTALL_CLEANUP: "ON"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-latest, windows-2022]
        toolchain:
          - {compiler: gcc, version: 9}
          - {compiler: gcc, version: 10}
          - {compiler: gcc, version: 11}
          - {compiler: gcc, version: 12}
          - {compiler: gcc, version: 13}
          - {compiler: intel, version: '2023.2'}
          - {compiler: intel-classic, version: '2021.10'}
          - {compiler: nvidia-hpc, version: '26.1'}
        exclude:
          - os: macos-latest
            toolchain: {compiler: gcc, version: 9}
          - os: macos-latest
            toolchain: {compiler: gcc, version: 10}
          - os: macos-latest
            toolchain: {compiler: gcc, version: 11}
          - os: macos-latest
            toolchain: {compiler: gcc, version: 12}
          - os: macos-latest
            toolchain: {compiler: intel, version: '2023.2'}
          - os: macos-latest
            toolchain: {compiler: nvidia-hpc, version: '26.1'}
          - os: windows-2022
            toolchain: {compiler: nvidia-hpc, version: '26.1'}
          # Windows 2022 has GCC 13+ and supports these Intel versions.
          - os: windows-2022
            toolchain: {compiler: gcc, version: 9}
          - os: windows-2022
            toolchain: {compiler: gcc, version: 10}
          - os: windows-2022
            toolchain: {compiler: gcc, version: 11}
          - os: windows-2022
            toolchain: {compiler: gcc, version: 12}
          # Keep legacy GCC coverage on Ubuntu 22.04 and test GCC 13 on 24.04.
          - os: ubuntu-22.04
            toolchain: {compiler: gcc, version: 13}
          - os: ubuntu-22.04
            toolchain: {compiler: intel, version: '2023.2'}
          - os: ubuntu-22.04
            toolchain: {compiler: intel-classic, version: '2021.10'}
          - os: ubuntu-22.04
            toolchain: {compiler: nvidia-hpc, version: '26.1'}
          - os: ubuntu-24.04
            toolchain: {compiler: gcc, version: 9}
          - os: ubuntu-24.04
            toolchain: {compiler: gcc, version: 10}
          - os: ubuntu-24.04
            toolchain: {compiler: gcc, version: 11}
          - os: ubuntu-24.04
            toolchain: {compiler: gcc, version: 12}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup fortran
        uses: fortran-lang/setup-fortran@v1
        id: setup-fortran
        with:
          compiler: ${{ matrix.toolchain.compiler }}
          version: ${{ matrix.toolchain.version }}

      - name: Set macOS SDK for Fortran linker
        if: contains(matrix.os, 'macos')
        shell: bash
        run: |
          sdkroot="$(xcrun --sdk macosx --show-sdk-path)"
          echo "SDKROOT=${sdkroot}" >> "${GITHUB_ENV}"
          test -f "${sdkroot}/usr/lib/libSystem.tbd"

      - name: Set up Python 3.x
        uses: actions/setup-python@v7 # Use pip to install latest CMake, & FORD/Jin2For, etc.
        with:
          python-version: 3.x

      - name: Install cmake and fypp
        run: pip install --upgrade cmake fypp

      - name: Configure with CMake (windows)
        if: contains(matrix.os, 'windows')
        run: >-
          cmake -Wauthor
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_INSTALL_PREFIX=_dist
          -G "MinGW Makefiles"
          -S . -B build

      - name: Configure with CMake (UNIX)
        if: contains(matrix.os, 'ubuntu') || contains(matrix.os, 'macos')
        run: >-
          cmake -Wauthor
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_INSTALL_PREFIX=_dist
          -S . -B build

      - name: Build and compile
        run: cmake --build build --parallel

      - name: catch build fail
        if: ${{ failure() }}
        run: cmake --build build --verbose --parallel 1

      - name: test
        run: >-
          ctest
          --test-dir build
          --parallel
          --output-on-failure
          --no-tests=error

      - name: Install project
        run: cmake --install build
